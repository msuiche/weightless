# DSV4-Vision-Exp VL lane compose (weightless lane 12).
# Day-0 VL image with the flashinfer dual-prefill topk-512 backport
# (vllm-upstream-vision:k2-topk512, local build — the wizard verifies
# presence instead of pulling). Serves the unstripped Vision-Exp checkpoint
# through DeepseekV4ForConditionalGeneration, nospec (the checkpoint's
# num_nextn_predict_layers=3 requires k%3==0 AND vl_model.py drops mtp.
# weights for the vision variant — no k loads a draft head; phase-3/4
# record in dspark-fork benchmarks/20260920-upstream-vision-*.md).
# --hf-overrides forces the VL wrapper (the hub config declares the text
# class). --enable-prompt-tokens-details is reporting-only (image-token
# breakdown in usage). GLP steering is applied by the bind-mounted hotfix
# in the entrypoint before exec vllm serve (fail-closed:
# patches/hotfix-dsv4vl-steering-projective.py exits 1 when steering is
# armed but cannot apply, and `|| exit 1` keeps the container down).
services:
  vllm-dsv4vl:
    image: ${DSV4VL_IMAGE:-vllm-upstream-vision:k2-topk512}
    container_name: deepseek-v4-flash-vision-vl-dspark-1
    network_mode: host
    ipc: host
    restart: "no"
    shm_size: "64gb"

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface
      # Node-local JIT/compile caches (issue #27: shared caches across nodes
      # fail as ABI mismatches, not cache errors). Local disk on every node.
      - ${JIT_CACHE_DIR:-${HOME}/.cache/dsv4vl}:/vllm-cache
      # GLP steering hotfix — patches the installed model.py inside the
      # container at boot; the vector is read from /cache/huggingface via
      # WEIGHTLESS_STEER_PATH. Spec: weightless/spec/GLP.md.
      - ${WEIGHTLESS_STEERING_HOTFIX:-./patches/hotfix-dsv4vl-steering-projective.py}:/opt/hotfix-dsv4vl-steering-projective.py:ro

    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      HF_HUB_DISABLE_XET: "1"
      VLLM_CACHE_ROOT: /vllm-cache
      FLASHINFER_WORKSPACE_BASE: /vllm-cache/flashinfer
      TORCHINDUCTOR_CACHE_DIR: /vllm-cache/torchinductor-cache
      TRITON_CACHE_DIR: /vllm-cache/triton-cache
      VLLM_ENGINE_READY_TIMEOUT_S: "${VLLM_ENGINE_READY_TIMEOUT_S:-3600}"
      VLLM_HOST_IP: "${VLLM_HOST_IP:-}"

      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"

      WEIGHTLESS_STEER_PATH: "${WEIGHTLESS_STEER_PATH:-}"
      WEIGHTLESS_STEER_ALPHA: "${WEIGHTLESS_STEER_ALPHA:-}"
      WEIGHTLESS_STEER_LAYERS: "${WEIGHTLESS_STEER_LAYERS:-}"
      WEIGHTLESS_STEER_HOOK: "${WEIGHTLESS_STEER_HOOK:-}"

    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >
        python3 /opt/hotfix-dsv4vl-steering-projective.py || exit 1;
        exec vllm serve ${WEIGHTLESS_MODEL:-deepseek-ai/DeepSeek-V4-Flash-Vision-Exp}
        --served-model-name ${SERVED_MODEL_NAME:-deepseek-v4-flash-vision-vl-dspark}
        --host ${VLLM_HOST:-127.0.0.1}
        --port ${VLLM_PORT:-8888}
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --kv-cache-dtype ${KV_CACHE_DTYPE:-fp8_ds_mla}
        --block-size 256
        --max-model-len ${MAX_MODEL_LEN:-131072}
        --max-num-seqs ${MAX_NUM_SEQS:-6}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-8192}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.80}
        --enable-prefix-caching
        --async-scheduling
        --enable-chunked-prefill
        --hf-overrides '{"architectures": ["DeepseekV4ForConditionalGeneration"]}'
        --enable-prompt-tokens-details
        --tokenizer-mode deepseek_v4
        --distributed-executor-backend mp
        --moe-backend ${MOE_BACKEND:-b12x}
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        --generation-config vllm
        --enable-flashinfer-autotune
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25000}
        ${HEADLESS:+--headless}
